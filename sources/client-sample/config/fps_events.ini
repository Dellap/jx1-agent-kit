; ==================================================================
;  VLTK Smooth  -  filtertext.dll
;  File nay do LAUNCHER quan ly. Sua bang launcher cho tien;
;  neu sua tay o day thi lan sau bam Luu tren launcher se ghi de.
;  (Ban truoc do duoc luu thanh fps_events.ini.bak)
; ==================================================================

[Smooth]
UnlockFps  = 100     ; Khoa FPS = so Hz man hinh. (0 = khong khoa)

OverlayOn  = 1      ; Goc thong tin tren-trai. 0 = an het.
OverlayX   = 10     ; Toa do X goc overlay (pixel tu mep trai).
OverlayY   = 20     ; Toa do Y dong dau overlay (pixel tu mep tren).
EventsShow = 0      ; Hien dem nguoc su kien. 0 = an su kien, VAN giu FPS + gio SV.

; --- Lam muot bo sung (moi tu ban 3.2) ---------------------------
;  Ba muc nay MAC DINH TAT. Tat = plugin chay y het ban 3.1.
;  Bat/tat trong game co hieu luc ngay, khong can khoi dong lai.
SmoothAnim   = 1    ; Animation skill / don danh chay theo FPS man hinh
SmoothEffect = 1    ; Hieu ung, dan phep bay muot thay vi nhay tung buoc
SmoothBody   = 1    ; Than nguoi di/chay muot (ban 3.6)

; --- Loc anh (do net khi phong to hinh) ---------------------------
;  Doi bang launcher. Doi xong phai THOAT GAME VAO LAI moi thay
;  (thu vien do hoa doc cai dat nay 1 lan luc mo game).
Filter     = lanczos-3

; --- Cai dat nang cao (launcher khong quan ly) --------------------
;  Cac dong duoi do NGUOI DUNG tu them. Launcher giu nguyen, khong sua.
ModEnabled = 1
NpcPredict = 1
NpcDelay = 85
NpcVelTau = 60

[Events]
; Hien goc tren-trai + dem nguoc; cai sap toi nhat duoc to sang.
;   hourly = moi gio phut 00      hourly:45 = moi gio phut 45
;   odd / even = gio le / gio chan      12:00,20:45 = moc gio cu the
Tong Kim             = odd
Phong Hoa Lien Thanh = even
Vuot Ai              = hourly
Phong Lang Do        = hourly:45
Boss Tieu Hoang Kim  = 12:00
Boss Dai Hoang Kim   = 12:45,20:45
Tuyet Dinh Vu De     = 12:45
